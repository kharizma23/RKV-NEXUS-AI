[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-backend"
version = "0.1.0"
description = "FastAPI Backend for Integrated AI Platform for Academic Assessment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0,<0.116.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "sqlalchemy[asyncio]>=2.0.28,<2.1.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "TRY201", "RUF059", "UP045", "F401", "E402", "UP007", "I001", "UP035", "F821"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["no-redef", "attr-defined", "assignment"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
    "app/modules"
]
