version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: assessment_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assessment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assessment_password}
      POSTGRES_DB: ${POSTGRES_DB:-assessment_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assessment_user} -d ${POSTGRES_DB:-assessment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assessment_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: assessment_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: assessment_server
    restart: always
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-assessment_user}:${POSTGRES_PASSWORD:-assessment_password}@postgres:5432/${POSTGRES_DB:-assessment_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-assessment_user}:${POSTGRES_PASSWORD:-assessment_password}@postgres:5432/${POSTGRES_DB:-assessment_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
